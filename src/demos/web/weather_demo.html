        <!-- Stylesheets -->

        <link rel="stylesheet" href="styles/base/typography.css">

        <link rel="stylesheet" href="styles/components/cards.css">

        <link rel="stylesheet" href="styles/components/footer.css">

    <body>
        <header class="site-header">
            <div class="header-left">
                <img src="images/LT_Logo.png" alt="Linktech Engineering Logo" class="logo">
            </div>
            <div class="header-center">
                <h1>Linktech Engineering LLC</h1>
                <h2>Owner: Leon McClatchey</h2>
            </div>
            <div class="header-right">
                <img src="images/LT_Logo.png" alt="Linktech Logo" class="logo">
            </div>
        </header>

        <!--#include virtual="/includes/sidenav.html" -->

        <div class="page-body">
            <main class="content-wrapper">

                <h1>Weather Demo</h1>

                <p class="intro">
                    This demo mirrors the behavior of <code>check_weather.py</code>.
                    Enter any location in a flexible format — City/State, ZIP code, or latitude/longitude.
                    The country defaults to <strong>US</strong> unless specified.
                </p>

                <form id="weather-form" class="weather-form">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="City/State, ZIP, or lat,lon" required>

                    <label for="country">Country (optional)</label>
                    <input type="text" id="country" placeholder="US" value="US">

                    <label for="units">Units</label>
                    <select id="units">
                        <option value="metric">Metric (°C, kph)</option>
                        <option value="imperial">Imperial (°F, mph)</option>
                    </select>

                    <button type="submit">Get Weather</button>
                </form>

                <div id="loading-spinner" class="loading-spinner" style="display:none;">
                    <div class="spinner"></div>
                    <div class="spinner-text">Loading weather…</div>
                </div>

                <!-- NEW: Weather metadata -->
                <div id="weather-meta" class="content fade-target"></div>

                    <div id="weather-container">

                        <!-- ALERTS (full-width banner) -->
                        <div class="content fade-target" id="alerts-content"></div>

                        <!-- CURRENT -->
                        <div class="content fade-target" id="current-content">
                            <div class="icon" id="current-icon"></div>
                            <div class="content" id="current-details"></div>
                            <div class="content" id="current-extras"></div>
                        </div>

                        <!-- WEEKLY -->
                        <div class="content fade-target" id="weekly-content">
                            <div class="icon" id="weekly-icon"></div>
                            <div class="content" id="weekly-details"></div>
                        </div>

                        <!-- HOURLY -->
                        <div class="content fade-target" id="hourly-content">
                            <div class="icon" id="hourly-icon"></div>
                            <div class="content" id="hourly-details"></div>
                        </div>

                    </div>

                <h2>Related Projects</h2>
                <!--#include virtual="/includes/related-nms_tools.html" -->
                <!--#include virtual="/includes/contact.html" -->

            </main>
        </div>

        <footer class="site-footer">
            <!--#include virtual="/includes/footer.html" -->

    </body>
