name: Test Forgejo Token

on:
  workflow_dispatch:

jobs:
  test-token:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Test API access to NMS_Tools nightly release
        env:
          TOKEN: ${{ secrets.NMSTOOLSTOKEN }}
        run: |
          echo "Testing Forgejo API token against NMS_Tools…"

          RESPONSE=$(curl -s \
            -H "Authorization: token $TOKEN" \
            http://dad:3000/api/v1/repos/linux/NMS_Tools/releases/nightly)

          echo "Raw response:"
          echo "$RESPONSE"

          # Try to parse JSON safely
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty' 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "⚠️ No release ID found — this usually means:"
            echo "   • The nightly release does not exist yet"
            echo "   • OR the token lacks repo:release permissions"
            exit 0
          fi

          echo "✅ Token test PASSED"
          echo "Nightly release ID: $RELEASE_ID"
