name: publish-dashboard

on:
  workflow_run:
    workflows: ["nightly-build"]
    types:
      - completed

  workflow_dispatch:

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run &&
       github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    container:
      image: dad:3000/linux/leon-ci:latest

    env:
      GIT_SSH_COMMAND: "ssh -F ~/.ssh/config -o IdentitiesOnly=yes"
      NMSTOOLS_SSH_KEY: ${{ secrets.TOOLSSSHKEY }}
      NMSTOOLS_TOKEN: ${{ secrets.TOOLSAPITOKEN }}

    steps:

      - name: Setup SSH keys and config
        run: |
          mkdir -p ~/.ssh

          echo "$NMSTOOLS_SSH_KEY" > ~/.ssh/id_nms_tools
          chmod 600 ~/.ssh/id_nms_tools

          ssh-keyscan -p 3001 -t ed25519 dad >> ~/.ssh/known_hosts

          cat <<EOF > ~/.ssh/config
          Host dad
              HostName dad
              Port 3001
              User runner
              IdentityFile ~/.ssh/id_nms_tools
              IdentitiesOnly yes
              UserKnownHostsFile ~/.ssh/known_hosts
          EOF

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Create Dashboard
        run: |
          mkdir -p website
          cp packaging/dashboard/index.html website/
          cp packaging/dashboard/dashboard.js website/
          curl -s -o website/qr.png \
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=http://dad:3000/Linux/NMS_Tools/"


      - name: Download release assets
        env:
          FORGEJO_API_ROOT: "http://dad:3000/api/v1/repos/linux/NMS_Tools"
        run: |
          mkdir -p website/artifacts

          curl -s \
            -H "Authorization: token $NMSTOOLS_TOKEN" \
            "$FORGEJO_API_ROOT/releases/tags/nightly" \
            > release.json

          jq -r '.assets[] | "\(.name)|\(.browser_download_url)"' release.json |
          while IFS='|' read NAME URL; do
            echo "Downloading $NAME"

            curl -L \
              -H "Authorization: token $NMSTOOLS_TOKEN" \
              "$URL" \
              -o "artifacts/$NAME"
          done

          ls -lh artifacts

      - name: Merge release metadata into dashboard
        run: |
          cp artifacts/metadata.json \
             Pages/NMS_Tools/metadata.json

      - name: Create destination folders
        run: |
          ssh -F ~/.ssh/config dad \
            "mkdir -p /srv/forgejo-pages/NMS_Tools/artifacts"

      - name: Deploy dashboard
        run: |
          rsync -avz --delete \
            -e "ssh -F ~/.ssh/config -o IdentitiesOnly=yes" \
            Pages/NMS_Tools/ \
            dad:/srv/forgejo-pages/NMS_Tools/

      - name: Deploy artifacts
        run: |
          rsync -avz --delete \
            -e "ssh -F ~/.ssh/config -o IdentitiesOnly=yes" \
            artifacts/ \
            dad:/srv/forgejo-pages/NMS_Tools/artifacts/

      - name: Verify deployment
        run: |
          ssh -F ~/.ssh/config dad \
            "find /srv/forgejo-pages/NMS_Tools -type f | sort"