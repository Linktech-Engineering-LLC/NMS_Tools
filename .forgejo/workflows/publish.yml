name: publish-dashboard
on:
  workflow_run:
    workflows: ["nightly-build"]
    types:
      - completed
  workflow_dispatch:

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    container:
      image: dad:3000/linux/leon-ci:latest
    env:
      GIT_SSH_COMMAND: "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes"
      NMSTOOLS_SSH_KEY: ${{ secrets.TOOLSSSHKEY }}
      NMSTOOLS_TOKEN: ${{ secrets.TOOLSAPITOKEN }}

    steps:
      - name: Setup SSH keys and config
        run: |
          mkdir -p /github/home/.ssh

          echo "$NMSTOOLS_SSH_KEY" > /github/home/.ssh/id_nms_tools
          chmod 600 /github/home/.ssh/id_nms_tools

          # Fetch actual host key for dad
          ssh-keyscan -p 2222 -t ed25519 dad >> /github/home/.ssh/known_hosts

          cat /github/home/.ssh/known_hosts

          cat <<EOF > /github/home/.ssh/config
          Host dad
              HostName dad
              Port 2222
              User runner
              IdentityFile /github/home/.ssh/id_nms_tools
              IdentitiesOnly yes
              UserKnownHostsFile /github/home/.ssh/known_hosts
          EOF

      - name: Clone Pages repo
        run: |
          git clone --depth 1 http://doug:$NMSTOOLS_TOKEN@dad:3000/doug/Pages.git Pages
          cd Pages
          git remote set-url origin http://doug:$NMSTOOLS_TOKEN@dad:3000/doug/Pages.git

      - name: Download release artifacts
        env:
          FORGEJO_API_ROOT: "http://dad:3000/api/v1/repos/linux/NMS_Tools"
        run: |
          mkdir -p artifacts

          curl -s \
            -H "Authorization: token $NMSTOOLS_TOKEN" \
            "$FORGEJO_API_ROOT/releases/tags/nightly" \
            > release.json

          jq -r '.assets[] | "\(.name)|\(.browser_download_url)"' release.json |
          while IFS='|' read NAME URL; do
            echo "Downloading $NAME"
            curl -L "$URL" -o "artifacts/$NAME"
          done

          ls -lh artifacts

      - name: Deploy dashboard via rsync
        run: |
          ssh -F /github/home/.ssh/config dad \
            "mkdir -p /srv/forgejo-pages/NMS_Tools/artifacts"

          rsync -avz --delete \
            -e "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes" \
            Pages/NMS_Tools/ \
            dad:/srv/forgejo-pages/NMS_Tools/

          rsync -avz --delete \
            -e "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes" \
            artifacts/ \
            dad:/srv/forgejo-pages/NMS_Tools/artifacts/

          ssh -F /github/home/.ssh/config dad \
            "find /srv/forgejo-pages/NMS_Tools -type f | sort"