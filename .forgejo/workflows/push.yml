on: [push, delete]

jobs:
  sync_to_remote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Remote Hub
        run: |
          git remote add remote_target ssh://git@github.com/linktech-engineering-llc/NMS_Tools.git
          # Push ONLY main
          git push github main

          # Push ONLY tags
          git push github --tags