name: Create Dashboard
env:
  FORGEJO_URL: "http://dad:3000/api/v1/repos/linux/NMS_Tools/releases/tags/nightly"
  FORGEJO_BASE: "ssh://forgejo@dad:3001/Linux/NMS_Tools.git"
  FORGEJO_PAGES: "http://doug:${{ secrets.TOOLSAPITOKEN }}@dad:3000/doug/Pages.git"
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Forgejo Nightly Build"
    types:
      - completed
      
concurrency:
  group: forgejo-nightly
  cancel-in-progress: true

jobs:
  create-dashboard:
    if: |
      ${{ github.event.workflow_run.conclusion == 'success' 
      || github.event_name == 'workflow_dispatch' }}    
    runs-on: ubuntu-latest
    container:
      image: dad:3000/linux/leon-ci:latest
    env:
      FORGEJO_API_ROOT: "http://dad:3000/api/v1/repos/linux/NMS_Tools"
      FORGEJO_SSH_KEY: ${{ secrets.TOOLSSSHKEY }}
      FORGEJO_TOKEN: ${{ secrets.NMSTOOLSTOKEN }}

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.local"

      - name: Download nightly metadata
        run: |
          mkdir -p artifacts

          curl -L \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_ROOT/releases/tags/nightly" \
            -o release.json
            
      - name: Download metadata.json
        run: |
          mkdir -p dashboard

          URL=$(jq -r '
            .assets[]
            | select(.name=="metadata.json")
            | .browser_download_url
          ' release.json)

          echo "Downloading metadata from $URL"

          curl -L \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$URL" \
            -o dashboard/metadata.json

      - name: Build dashboard folder
        run: |
          mkdir -p dashboard

          cp packaging/dashboard/index.html dashboard/
          cp packaging/dashboard/dashboard.js dashboard/


          curl -s -o dashboard/qr.png \
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=http://dad:3000/Linux/NMS_Tools/"

      - name: Clone global Pages repo
        run: |
          set -x

          mkdir -p ~/.ssh
          echo "$FORGEJO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

          ssh-keyscan -p 3001 dad >> ~/.ssh/known_hosts

          echo "FORGEJO_PAGES=$FORGEJO_PAGES"

          git ls-remote "$FORGEJO_PAGES"

          git clone --depth 1 "$FORGEJO_PAGES" pagesrepo
          cd pagesrepo

          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.local"

          rm -rf NMS_Updates
          mkdir -p NMS_Tools
          rm -rf NMS_Tools/*
          cp -r ../dashboard/* NMS_Tools/

          git add .
          git diff --staged --quiet || \
          git commit -m "Nightly NMS_Tools dashboard update"
          git branch -M main
          git push origin main --force
