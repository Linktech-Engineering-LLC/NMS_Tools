# Workflow: nightly.yml
# Workflow Class: Build
# Package: NMS_Tools
# Repository: Linus/NMS_Tools
#
# Author: Leon McClatchey
# Company: Linktech Engineering LLC
#
# Created: 2026-11-10
# Modified: 2026-11-10
# Version: 1.0.0
#
# Purpose:
#   Builds the packages and then publishes to a local server
#
# Triggers:
#   - workflow_dispatch
#   - cron: "0 6 * * *"   # 06:00 UTC nightly
#
# Dependencies:
#   - none
#
# Artifacts Consumed:
#   - none
#
# Artifacts Produced:
#   - none
#
# Required Secrets:
#   - none
#
# Pipeline:
#
#   nightly-build
#          |
#          v
#       publish
#
# Notes:
#   Additional implementation details
name: Forgejo Nightly Build
env:
  FORGEJO_URL: "http://dad:3000/api/v1/repos/linux/NMS_Tools/releases/tags/nightly"
  FORGEJO_BASE: "ssh://forgejo@dad:3001/Linux/NMS_Tools.git"

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

concurrency:
  group: forgejo-nightly
  cancel-in-progress: true

jobs:

  nightly-build:
    runs-on: ubuntu-latest
    container:
      image: dad:3000/linux/leon-ci:latest
    env:
      FORGEJO_TOKEN: ${{ secrets.NMSTOOLSTOKEN }}
      FORGEJO_API: ${{ secrets.TOOLSAPITOKEN}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure nightly tag exists
        run: |
          if ! git ls-remote --tags origin nightly >/dev/null; then
            echo "Creating nightly tag"
            git tag nightly
            git push origin nightly
          else
            echo "Updating nightly tag to current commit"
            git tag -f nightly
            git push origin nightly --force
          fi

      - name: Capture metadata
        id: capture
        run: |
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
          echo "git_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Install Python 3.12
        run: |
          apt-get update
          apt-get install -y python3.12 python3.12-dev python3.12-venv

      - name: Install pandoc
        run: |
          apt-get update
          apt-get install -y pandoc
      - name: Create virtual environment
        run: |
          python3.12 -m venv /opt/venv
          source /opt/venv/bin/activate
          python -m pip install --upgrade pip

      - name: Install Python build dependencies
        run: |
          source /opt/venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller jsonschema
          pip install git+http://dad:3000/linux/PythonTools.git

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh
          chmod +x packaging/*.sh

      - name: Build all artifacts
        run: |
          source /opt/venv/bin/activate
          packaging/build_all.sh

      - name: Collect artifacts
        run: |
          curl -v -H "Authorization: token $FORGEJO_TOKEN" "$FORGEJO_URL"
          ls -al packaging/output
          mkdir -p artifacts
          cp packaging/output/*.tgz artifacts/ || true
          cp packaging/output/*.zip artifacts/ || true
          cp packaging/output/*.deb artifacts/ || true
          cp packaging/output/*.rpm artifacts/ || true
          ls -al artifacts
      - name: Generate metadata.json
        run: |
          mkdir -p artifacts
          source /opt/venv/bin/activate
          PYTHON_VERSION=$(python3 --version | awk '{print $2}')
          PYINSTALLER_VERSION=$(pyinstaller --version 2>/dev/null || echo "unknown")
          BUILDER_OS="forgejo-runner"

          cat > artifacts/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "${{ steps.capture.outputs.build_date }}",
              "commit": "${{ steps.capture.outputs.git_hash }}",
              "branch": "nightly"
            },
            "toolchain": {
              "python": "$PYTHON_VERSION",
              "pyinstaller": "$PYINSTALLER_VERSION",
              "builder_os": "$BUILDER_OS"
            },
            "binary_license": {
              "name": "NMS_Tools Binary License",
              "file": "LICENSE_BINARY.txt",
              "url": "http://dad:3000/linux/NMS_Tools/src/branch/nightly/LICENSE_BINARY.txt"
            },
            "artifacts": [
          EOF

          FIRST=1
          for f in artifacts/nms-tools_*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            CRC=$(crc32 "$f")

            case "$NAME" in
              *.deb) TYPE="deb"; OS="linux"; ARCH="amd64";;
              *.rpm) TYPE="rpm"; OS="linux"; ARCH="x86_64";;
              *.zip) TYPE="zip"; OS="windows"; ARCH="x86_64";;
              *.tgz|*.tar.gz) TYPE="tgz"; OS="linux"; ARCH="amd64";;
              *) TYPE="unknown"; OS="unknown"; ARCH="unknown";;
            esac

            if [ $FIRST -eq 0 ]; then
              echo "," >> artifacts/metadata.json
            fi
            FIRST=0

            cat >> artifacts/metadata.json <<EOF
              {
                "name": "$NAME",
                "type": "$TYPE",
                "os": "$OS",
                "arch": "$ARCH",
                "size": $SIZE,
                "sha256": "$SHA",
                "crc32": "$CRC"
              }
          EOF
          done

          cat >> artifacts/metadata.json <<EOF
            ]
          }
          EOF

      # ============================================================
      # Ensure Forgejo nightly release exists (using GitHub metadata)
      # ============================================================

      - name: Ensure Forgejo nightly release exists
        id: forgejo_release
        run: |
          RELEASE=$(curl -s \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_URL" \
            | jq -r '.id // empty')

          if [ -z "$RELEASE" ]; then
            echo "Creating Forgejo nightly release"
            curl -s -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"tag_name":"nightly","name":"Nightly Build","body":"Nightly build artifacts","prerelease":true}' \
              http://dad:3000/api/v1/repos/linux/NMS_Tools/releases

            RELEASE=$(curl -s \
              -H "Authorization: token $FORGEJO_TOKEN" \
              "$FORGEJO_URL" \
              | jq -r '.id // empty')
          fi

          echo "forgejo_id=$RELEASE" >> $GITHUB_OUTPUT

      # ============================================================
      # Remove existing Forgejo nightly assets
      # ============================================================

      - name: Remove existing Forgejo nightly assets
        run: |
          RELEASE=${{ steps.forgejo_release.outputs.forgejo_id }}

          curl -s \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_URL" \
            | jq -r '.assets[].id // empty' \
            | while read ID; do
                [ -z "$ID" ] && continue
                echo "Deleting Forgejo asset $ID"
                curl -s -X DELETE \
                  -H "Authorization: token $FORGEJO_TOKEN" \
                  "http://dad:3000/api/v1/repos/linux/NMS_Tools/releases/$RELEASE/assets/$ID"
              done

      # ============================================================
      # Upload Forgejo-built artifacts → Forgejo nightly release
      # ============================================================

      - name: Upload Forgejo-built artifacts to Forgejo release
        run: |
          RELEASE=${{ steps.forgejo_release.outputs.forgejo_id }}

          for f in artifacts/*; do
            echo "Uploading $f"
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.NMSTOOLSTOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "http://dad:3000/api/v1/repos/linux/NMS_Tools/releases/$RELEASE/assets?name=$(basename "$f")"
          done

  publish:
    needs: nightly-build
    runs-on: ubuntu-latest

    container:
      image: dad:3000/linux/leon-ci:latest

    env:
      GIT_SSH_COMMAND: "ssh -F ~/.ssh/config -o IdentitiesOnly=yes"
      NMSTOOLS_SSH_KEY: ${{ secrets.TOOLSSSHKEY }}
      NMSTOOLS_TOKEN: ${{ secrets.TOOLSAPITOKEN }}

    steps:

      - name: Setup SSH keys and config
        run: |
          mkdir -p ~/.ssh

          echo "$NMSTOOLS_SSH_KEY" > ~/.ssh/id_nms_tools
          chmod 600 ~/.ssh/id_nms_tools

          ssh-keyscan -p 2222 -t ed25519 dad >> ~/.ssh/known_hosts

          cat <<EOF > ~/.ssh/config
          Host dad
              HostName dad
              Port 2222
              User runner
              IdentityFile ~/.ssh/id_nms_tools
              IdentitiesOnly yes
              UserKnownHostsFile ~/.ssh/known_hosts
          EOF

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Create Dashboard
        run: |
          mkdir -p website
          cp packaging/dashboard/index.html website/
          cp packaging/dashboard/dashboard.js website/
          cp packaging/dashboard/styles.css website/
          curl -s -o website/qr.png \
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=http://dad:3000/Linux/NMS_Tools/"


      - name: Download release assets
        env:
          FORGEJO_API_ROOT: http://dad:3000/api/v1/repos/linux/NMS_Tools
        run: |
          mkdir -p website/artifacts

          curl -s \
            -H "Authorization: token $NMSTOOLS_TOKEN" \
            "$FORGEJO_API_ROOT/releases/tags/nightly" \
            > release.json

          jq -r '.assets[] | "\(.name)|\(.browser_download_url)"' release.json |
          while IFS='|' read NAME URL; do
            echo "Downloading $NAME"

            if [ "$NAME" = "metadata.json" ]; then
              curl -L \
                -H "Authorization: token $NMSTOOLS_TOKEN" \
                "$URL" \
                -o "website/metadata.json"
            else
              curl -L \
                -H "Authorization: token $NMSTOOLS_TOKEN" \
                "$URL" \
                -o "website/artifacts/$NAME"
            fi
          done

          echo "Website contents:"
          find website -type f | sort

      - name: Verify downloaded assets
        run: |
          echo "Website contents:"
          find website -type f | sort

      - name: Verify metadata
        run: |
          test -f website/metadata.json

      - name: Create destination folders
        run: |
          ssh -F ~/.ssh/config dad \
            "mkdir -p /srv/forgejo-pages/NMS_Tools/nightly/artifacts"

      - name: Deploy dashboard
        run: |
          rsync -avz --delete \
            -e "ssh -F $HOME/.ssh/config -o IdentitiesOnly=yes" \
            website/ \
            dad:/srv/forgejo-pages/NMS_Tools/nightly

      - name: Verify deployment
        run: |
          ssh -F ~/.ssh/config dad \
            "find /srv/forgejo-pages/NMS_Tools/nightly -type f | sort"
