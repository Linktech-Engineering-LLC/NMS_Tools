name: Build NMS_Tools Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RPM build dependencies
        run: |
          sudo apt-get install -y pandoc rpm dpkg-dev      

      - name: Install Python build dependencies
        run: |
          pip install pyinstaller
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Build tools
        run: |
          ./scripts/build_all.sh
      - name: Copy binaries to build folder
        run: |
          mkdir -p build/linux-x86_64
          cp -r dist/* build/linux-x86_64/

      - name: Build DEB and RPM via Makefile
        run: |
          make packages

      - name: Collect DEB and RPM artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp packaging/nms-tools_*.deb artifacts/ || true
          find "$HOME/rpmbuild/RPMS" -type f -name "nms_tools-*.rpm" -exec cp {} artifacts/ \; || true

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nms-tools-packages
          path: artifacts/

      - name: Upload to GitHub Release (tagged builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
