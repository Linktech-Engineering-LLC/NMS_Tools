name: NMS_Tools Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      manual_version:
        description: "Optional version override (leave blank to use tag)"
        required: false
        default: ""

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            shellcheck \
            rpm \
            dpkg-dev
          pip install flake8 black isort yamllint pyinstaller

      - name: Run lint checks (non-blocking)
        run: |
          flake8 || true
          black --check . || true
          isort --check-only . || true
          yamllint . || true
          shellcheck **/*.sh || true

      - name: Validate environment
        run: python3 tools/validate_env.py

      - name: Build PyInstaller binaries
        run: ./scripts/build_all.sh

      - name: Build DEB and RPM packages
        run: make packages

      - name: Collect release artifacts
        run: |
          mkdir -p release_artifacts
          cp build/linux-x86_64/* release_artifacts/ || true
          cp packaging/nms-tools_*.deb release_artifacts/ || true
          find "$HOME/rpmbuild/RPMS" -type f -name "*.rpm" -exec cp {} release_artifacts/ \; || true

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nms-tools-release
          path: release_artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
