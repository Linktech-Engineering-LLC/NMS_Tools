name: NMS_Tools Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      manual_version:
        description: "Optional version override (leave blank to use tag)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: true

jobs:

  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            shellcheck \
            rpm \
            dpkg-dev \
            zip \
            crc32

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install git+https://github.com/linktech-engineering-llc/PythonTools.git
          python3 -m pip install pyinstaller 
          python3 -m pip install flake8 black isort yamllint

      - name: Run lint checks (non-blocking)
        run: |
          flake8 || true
          black --check . || true
          isort --check-only . || true
          yamllint . || true
          shellcheck **/*.sh || true

      - name: Validate environment
        run: python3 tools/validate_env.py

      - name: Make scripts executable
        run: chmod +x scripts/*.sh packaging/*.sh

      - name: Run full packaging pipeline
        run: packaging/build_all.sh

      - name: Collect release artifacts
        run: |
          mkdir -p release_artifacts
          cp packaging/output/*.tgz release_artifacts/ || true
          cp packaging/output/*.zip release_artifacts/ || true
          cp packaging/output/*.deb release_artifacts/ || true
          cp packaging/output/*.rpm release_artifacts/ || true

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nms-tools-release
          path: release_artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-stable-dashboard:
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: nms-tools-release
          path: artifacts

      - name: Extract version metadata
        id: meta
        run: |
          DEB_FILE=$(ls -t artifacts/*.deb | head -n 1)
          BASENAME=$(basename "$DEB_FILE")
          VERSION=$(echo "$BASENAME" | sed -n 's/nms-tools_\(.*\)\.deb/\1/p')
          DATESTAMP=$(echo "$VERSION" | grep -o '+[0-9]\{8\}' | tr -d '+')
          GIT_HASH=$(echo "$VERSION" | sed -n 's/.*git\([0-9a-f]\+\).*/\1/p')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "datestamp=$DATESTAMP" >> $GITHUB_OUTPUT
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT

      - name: Compute checksums and sizes
        id: sums
        run: |
          for f in artifacts/*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            echo "${NAME}_size=$SIZE" >> $GITHUB_OUTPUT
            echo "${NAME}_sha256=$SHA" >> $GITHUB_OUTPUT
          done

      - name: Prepare stable dashboard folder
        run: |
          mkdir -p stable

      - name: Generate stable dashboard HTML
        run: |
          cat > stable/index.html <<EOF
          <html>
          <head>
            <title>NMS_Tools Stable Dashboard</title>
            <style>
              body { font-family: Arial; margin: 20px; }
              table { border-collapse: collapse; margin-top: 10px; }
              th, td { padding: 8px 12px; border: 1px solid #ccc; }
              th { background: #f0f0f0; }
            </style>
          </head>
          <body>

          <h1>NMS_Tools Stable Dashboard</h1>

          <img id="version-badge">
          <img id="date-badge">
          <img id="python-badge">
          <img id="pyi-badge">

          <h2>Build Information</h2>
          <div id="build-info"></div>

          <h2>Artifacts</h2>
          <div id="artifact-table"></div>

          <script src="dashboard.js"></script>

          </body>
          </html>
          EOF

      - name: Generate metadata.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          DATESTAMP="${{ steps.meta.outputs.datestamp }}"
          GIT_HASH="${{ steps.meta.outputs.hash }}"
          RUN_ID="${{ github.run_id }}"

          cat > stable/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
              "commit": "${GIT_HASH}",
              "branch": "stable",
              "version": "${VERSION}",
              "workflow_run_id": "${RUN_ID}"
            },
            "toolchain": {
              "python": "$(python3 --version | awk '{print $2}')",
              "pyinstaller": "$(pyinstaller --version)"
            },
            "artifacts": [
          EOF

          FIRST=1
          for f in artifacts/*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            CRC=$(crc32 "$f" || echo "00000000")
            TYPE=$(echo "$NAME" | sed -E 's/.*\.(tgz|zip|deb|rpm)$/\1/')
            OS="linux"
            ARCH="x86_64"

            if [ $FIRST -eq 0 ]; then echo "," >> stable/metadata.json; fi
            FIRST=0

            cat >> stable/metadata.json <<EOF
              {
                "name": "${NAME}",
                "size": ${SIZE},
                "sha256": "${SHA}",
                "crc32": "${CRC}",
                "type": "${TYPE}",
                "os": "${OS}",
                "arch": "${ARCH}"
              }
          EOF
          done

          echo "    ]" >> stable/metadata.json
          echo "}" >> stable/metadata.json

      - name: Copy dashboard.js
        run: cp packaging/dashboard/dashboard.js stable/

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stable

  deploy:
    needs: publish-stable-dashboard
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
