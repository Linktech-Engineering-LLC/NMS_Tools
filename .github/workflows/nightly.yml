name: Nightly Build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly-build:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.capture.outputs.build_date }}
      version: ${{ steps.meta.outputs.version }}
      hash: ${{ steps.meta.outputs.hash }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture metadata
        id: capture
        run: |
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
          echo "git_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            rpm \
            dpkg-dev \
            zip \
            libarchive-zip-perl

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Make scripts executable
        run: chmod +x scripts/*.sh packaging/*.sh

      - name: Run full packaging pipeline
        run: packaging/build_all.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packaging/output/*.tgz artifacts/ || true
          cp packaging/output/*.zip artifacts/ || true
          cp packaging/output/*.deb artifacts/ || true
          cp packaging/output/*.rpm artifacts/ || true

      - name: Export version and commit
        id: meta
        run: |
          DEB_FILE=$(ls -t packaging/output/nms-tools_* | head -n 1)
          BASENAME=$(basename "$DEB_FILE")
          VERSION=$(echo "$BASENAME" | sed -E 's/nms-tools[-_]?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "hash=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Upload nightly artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          prerelease: true
          files: |
            packaging/output/*.zip
            packaging/output/*.tgz
            packaging/output/*.deb
            packaging/output/*.rpm

      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Export commit hash
        id: commit
        run: echo "hash=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  publish-dashboard:
    runs-on: ubuntu-latest
    needs: nightly-build

    steps:
      - name: Install dashboard dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-zip-perl
          python3 -m pip install pyinstaller

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Checkout main branch into subfolder
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Copy dashboard assets from main
        run: |
          cp source/packaging/dashboard/index.html dashboard/
          cp source/packaging/dashboard/styles.css dashboard/
          cp source/packaging/dashboard/dashboard.js dashboard/

      - name: Extract version metadata
        id: meta
        run: |
          DEB_FILE=$(ls -t artifacts/nms-tools_* | head -n 1)
          BASENAME=$(basename "$DEB_FILE")
          VERSION=$(echo "$BASENAME" | sed -E 's/nms-tools[-_]?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          DATESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_HASH=$(git rev-parse --short HEAD)
          PYI_VERSION=$(pyinstaller --version)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "datestamp=$DATESTAMP" >> $GITHUB_OUTPUT
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT
          echo "pyinstaller=$PYI_VERSION" >> $GITHUB_OUTPUT

      - name: Compute checksums and sizes
        id: sums
        run: |
          for f in artifacts/*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            echo "${NAME}_size=$SIZE" >> $GITHUB_OUTPUT
            echo "${NAME}_sha256=$SHA" >> $GITHUB_OUTPUT
          done

      - name: Generate QR code
        run: |
          mkdir -p dashboard
          curl -s -o dashboard/qr.png \
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://linktech-engineering-llc.github.io/NMS_Tools/"

      - name: Generate dashboard HTML
        run: |
          mkdir -p dashboard
          RELEASE_URL="https://github.com/Linktech-Engineering-LLC/NMS_Tools/releases/download/nightly"
          rm -f dashboard/*

          cat > dashboard/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>NMS_Tools Nightly Dashboard</title>
            <link rel="stylesheet" href="styles.css">
          </head>
          <body>

          <h1>NMS_Tools Nightly Dashboard</h1>

          <div class="badge-row">
            <img id="version-badge">
            <img id="date-badge">
            <img id="python-badge">
            <img id="pyi-badge">
          </div>

          <h2>Build Metadata</h2>
          <div id="build-info"></div>

          <h2>Artifacts</h2>
          <div id="artifact-table"></div>

          <div class="qr">
            <h2>QR Code</h2>
            <img id="qr-code" src="qr.png" alt="QR Code">
          </div>

          <script src="dashboard.js"></script>
          </body>
          </html>
          EOF

      - name: Generate metadata.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          DATESTAMP="${{ steps.meta.outputs.datestamp }}"
          GIT_HASH="${{ needs.nightly-build.outputs.hash }}"
          RUN_ID="${{ github.run_id }}"
          PYTHON_VERSION=$(python3 --version | awk '{print $2}')
          PYINSTALLER_VERSION=$(pyinstaller --version 2>/dev/null || echo "unknown")

          mkdir -p dashboard

          cat > dashboard/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "${{ steps.capture.outputs.build_date }}",
              "commit": "${{ steps.capture.outputs.git_hash }}",
              "branch": "nightly",
              "workflow_run_id": $GITHUB_RUN_ID
            },
            "toolchain": {
              "python": "$PYTHON_VERSION",
              "pyinstaller": "$PYINSTALLER_VERSION",
            },
            "artifacts": [
          EOF

          FIRST=true
          for f in artifacts/*; do
            [ -f "$f" ] || continue

            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA256=$(sha256sum "$f" | awk '{print $1}')
            CRC32=$(crc32 "$f")

            TYPE="unknown"
            OS="unknown"
            ARCH="unknown"

            case "$NAME" in
              *.zip) TYPE="zip"; OS="any"; ARCH="any" ;;
              *.tgz) TYPE="tgz"; OS="any"; ARCH="any" ;;
              *.deb) TYPE="deb"; OS="linux"; ARCH="amd64" ;;
              *.rpm) TYPE="rpm"; OS="linux"; ARCH="x86_64" ;;
            esac

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> dashboard/metadata.json
            fi

            cat >> dashboard/metadata.json <<EOF
              {
                "name": "${NAME}",
                "size": ${SIZE},
                "sha256": "${SHA256}",
                "crc32": "${CRC32}",
                "type": "${TYPE}",
                "os": "${OS}",
                "arch": "${ARCH}"
              }
          EOF
          done

          echo "      ]" >> dashboard/metadata.json
          echo "}" >> dashboard/metadata.json

      - name: Publish dashboard to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp -r dashboard/* .

          git add .
          git commit -m "Update nightly dashboard" || echo "No changes"
          git push origin gh-pages
