name: Nightly Build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:

  nightly-build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.capture.outputs.version }}
      commit: ${{ steps.capture.outputs.commit }}
      build_date: ${{ steps.capture.outputs.build_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc rpm dpkg-dev zip libarchive-zip-perl

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Make scripts executable
        run: chmod +x scripts/*.sh packaging/*.sh

      - name: Run full packaging pipeline
        run: packaging/build_all.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packaging/output/*.tgz artifacts/ || true
          cp packaging/output/*.zip artifacts/ || true
          cp packaging/output/*.deb artifacts/ || true
          cp packaging/output/*.rpm artifacts/ || true

      # ⭐ THIS IS THE IMPORTANT PART ⭐
      - name: Capture version + commit + date
        id: capture
        run: |
          DEB_FILE=$(ls -t packaging/output/nms-tools_* | head -n 1)
          BASENAME=$(basename "$DEB_FILE")
          VERSION=$(echo "$BASENAME" | sed -E 's/nms-tools[-_]?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Upload nightly artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          prerelease: true
          files: |
            packaging/output/*.zip
            packaging/output/*.tgz
            packaging/output/*.deb
            packaging/output/*.rpm

      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly


  publish-dashboard:
    runs-on: ubuntu-latest
    needs: nightly-build

    steps:
      - name: Install dashboard dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-zip-perl
          python3 -m pip install pyinstaller

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Checkout main branch into subfolder
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Copy dashboard assets from main
        run: |
          mkdir -p dashboard
          cp source/packaging/dashboard/index.html dashboard/
          cp source/packaging/dashboard/styles.css dashboard/
          cp source/packaging/dashboard/dashboard.js dashboard/

      - name: Compute checksums and sizes
        id: sums
        run: |
          for f in artifacts/*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            echo "${NAME}_size=$SIZE" >> $GITHUB_OUTPUT
            echo "${NAME}_sha256=$SHA" >> $GITHUB_OUTPUT
          done

      - name: Generate QR code
        run: |
          mkdir -p dashboard
          curl -s -o dashboard/qr.png \
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://linktech-engineering-llc.github.io/NMS_Tools/"

      - name: Generate metadata.json
        run: |
          VERSION="${{ needs.nightly-build.outputs.version }}"
          COMMIT="${{ needs.nightly-build.outputs.commit }}"
          DATESTAMP="${{ needs.nightly-build.outputs.build_date }}"
          RUN_ID="${{ github.run_id }}"
          PYI_VERSION=$(pyinstaller --version)

          mkdir -p dashboard

          cat > dashboard/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "${DATESTAMP}",
              "commit": "${COMMIT}",
              "version": "${VERSION}",
              "branch": "nightly",
              "workflow_run_id": "${RUN_ID}"
            },
            "toolchain": {
              "python": "$(python3 --version | awk '{print $2}')",
              "pyinstaller": "${PYI_VERSION}"
            },
            "artifacts": [
          EOF

          FIRST=true
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA256=$(sha256sum "$f" | awk '{print $1}')
            CRC32=$(crc32 "$f")

            TYPE="unknown"
            OS="unknown"
            ARCH="unknown"

            case "$NAME" in
              *.zip) TYPE="zip"; OS="any"; ARCH="any" ;;
              *.tgz) TYPE="tgz"; OS="any"; ARCH="any" ;;
              *.deb) TYPE="deb"; OS="linux"; ARCH="amd64" ;;
              *.rpm) TYPE="rpm"; OS="linux"; ARCH="x86_64" ;;
            esac

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> dashboard/metadata.json
            fi

            cat >> dashboard/metadata.json <<EOF
          {
            "name": "${NAME}",
            "size": ${SIZE},
            "sha256": "${SHA256}",
            "crc32": "${CRC32}",
            "type": "${TYPE}",
            "os": "${OS}",
            "arch": "${ARCH}"
          }
          EOF
          done

          echo "  ]" >> dashboard/metadata.json
          echo "}" >> dashboard/metadata.json

      - name: Publish dashboard to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r dashboard/* .
          git add .
          git commit -m "Update nightly dashboard" || echo "No changes"
          git push origin gh-pages
