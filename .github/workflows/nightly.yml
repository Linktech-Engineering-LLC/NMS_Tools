name: Nightly Build

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:

  nightly-build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.capture.outputs.version }}
      commit: ${{ steps.capture.outputs.commit }}
      build_date: ${{ steps.capture.outputs.build_date }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc rpm dpkg-dev 
          sudo apt-get install -y libarchive-zip-perl

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller jsonschema

      - name: Make scripts executable
        run: chmod +x scripts/*.sh packaging/*.sh

      - name: Run full packaging pipeline
        run: packaging/build_all.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packaging/output/*.tgz artifacts/ || true
          cp packaging/output/*.zip artifacts/ || true
          cp packaging/output/*.deb artifacts/ || true
          cp packaging/output/*.rpm artifacts/ || true

      - name: Capture version + commit + date
        id: capture
        run: |
          DEB_FILE=$(ls -t packaging/output/nms-tools_* | head -n 1)
          BASENAME=$(basename "$DEB_FILE")
          VERSION=$(echo "$BASENAME" | sed -E 's/nms-tools[-_]?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Generate metadata.json
        run: |
          mkdir -p artifacts

          # Detect toolchain versions
          PYTHON_VERSION=$(python3 --version | awk '{print $2}')
          PYINSTALLER_VERSION=$(pyinstaller --version 2>/dev/null || echo "unknown")
          BUILDER_OS="ubuntu-latest"

          # Start metadata.json
          cat > artifacts/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "${{ steps.capture.outputs.build_date }}",
              "commit": "${{ steps.capture.outputs.commit }}",
              "version": "${{ steps.capture.outputs.version }}",
              "branch": "nightly",
              "workflow_run_id": $GITHUB_RUN_ID
            },
            "toolchain": {
              "python": "$PYTHON_VERSION",
              "pyinstaller": "$PYINSTALLER_VERSION",
              "builder_os": "$BUILDER_OS"
            },
            "binary_license": {
              "name": "NMS_Tools Binary License",
              "file": "LICENSE_BINARY.txt",
              "url": "https://github.com/linktech-engineering-llc/NMS_Tools/blob/nightly/LICENSE_BINARY.txt"
            },
            "artifacts": [
          EOF

          FIRST=1
          for f in artifacts/nms-tools_*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            CRC=$(crc32 "$f")

            # Detect type, OS, arch
            case "$NAME" in
              *.deb)
                TYPE="deb"
                OS="linux"
                ARCH="amd64"
                ;;
              *.rpm)
                TYPE="rpm"
                OS="linux"
                ARCH="x86_64"
                ;;
              *.zip)
                TYPE="zip"
                OS="windows"
                ARCH="x86_64"
                ;;
              *.tgz|*.tar.gz)
                TYPE="tgz"
                OS="linux"
                ARCH="amd64"
                ;;
              *)
                TYPE="unknown"
                OS="unknown"
                ARCH="unknown"
                ;;
            esac

            if [ $FIRST -eq 0 ]; then
              echo "," >> artifacts/metadata.json
            fi
            FIRST=0

            cat >> artifacts/metadata.json <<EOF
              {
                "name": "$NAME",
                "type": "$TYPE",
                "os": "$OS",
                "arch": "$ARCH",
                "size": $SIZE,
                "sha256": "$SHA",
                "crc32": "$CRC"
              }
          EOF

          done

          # Close JSON
          cat >> artifacts/metadata.json <<EOF
            ]
          }
          EOF

      - name: Validate metadata.json
        run: |
          python3 packaging/metadata/validate.py artifacts/metadata.json

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      - name: Remove existing nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view nightly --json assets --jq '.assets[].name')
          for asset in $ASSETS; do
            if [[ "$asset" == nms-tools* ]]; then
              echo "Deleting asset: $asset"
              gh release delete-asset nightly "$asset" --yes
            fi
          done

      - name: Upload artifacts to nightly release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          files: packaging/output/*

      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly


  publish-dashboard:
    runs-on: ubuntu-latest
    needs: nightly-build

    steps:

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          submodules: false

      - name: Preserve existing dashboard files
        run: |
          mkdir -p dashboard
          cp dashboard.js dashboard.js.bak 2>/dev/null || true

      - name: Download nightly artifacts
        uses: actions/download-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      - name: Copy metadata.json to dashboard root
        run: cp artifacts/metadata.json .

      - name: Checkout main branch into subfolder
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          submodules: false

      - name: Copy dashboard assets
        run: |
          cp source/packaging/dashboard/index.html .
          cp source/packaging/dashboard/styles.css .
          cp source/packaging/dashboard/dashboard.js .

      - name: Publish dashboard to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update nightly dashboard" || echo "No changes"
          git push origin gh-pages
