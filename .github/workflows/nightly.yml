name: Nightly Build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:

  nightly-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            rpm \
            dpkg-dev \
            zip

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Make scripts executable
        run: chmod +x scripts/*.sh packaging/*.sh

      - name: Run full packaging pipeline
        run: packaging/build_all.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packaging/output/*.tgz artifacts/ || true
          cp packaging/output/*.zip artifacts/ || true
          cp packaging/output/*.deb artifacts/ || true
          cp packaging/output/*.rpm artifacts/ || true

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

  publish-dashboard:
    runs-on: ubuntu-latest
    needs: nightly-build

    steps:
      # Checkout MAIN so we can access dashboard.js and templates
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main

      # Checkout GH-PAGES into a separate folder
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download nightly artifacts
        uses: actions/download-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      - name: Extract version metadata
        id: meta
        run: |
          DEB_FILE=$(ls -t artifacts/*.deb | head -n 1)
          BASENAME=$(basename "$DEB_FILE")
          VERSION=$(echo "$BASENAME" | sed -n 's/nms-tools_\(.*\)\.deb/\1/p')
          DATESTAMP=$(echo "$VERSION" | grep -o '+[0-9]\{8\}' | tr -d '+')
          GIT_HASH=$(echo "$VERSION" | sed -n 's/.*git\([0-9a-f]\+\).*/\1/p')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "datestamp=$DATESTAMP" >> $GITHUB_OUTPUT
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT

      - name: Compute checksums and sizes
        id: sums
        run: |
          for f in artifacts/*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            echo "${NAME}_size=$SIZE" >> $GITHUB_OUTPUT
            echo "${NAME}_sha256=$SHA" >> $GITHUB_OUTPUT
          done

      # Build dashboard inside gh-pages/nightly
      - name: Prepare nightly folder
        run: mkdir -p gh-pages/nightly

      - name: Generate dashboard HTML
        run: |
          cat > gh-pages/nightly/index.html <<EOF
          <html>
          <head>
            <title>NMS_Tools Dashboard</title>
            <style>
              body { font-family: Arial; margin: 20px; }
              table { border-collapse: collapse; margin-top: 10px; }
              th, td { padding: 8px 12px; border: 1px solid #ccc; }
              th { background: #f0f0f0; }
            </style>
          </head>
          <body>

          <h1>NMS_Tools Dashboard</h1>

          <img id="version-badge">
          <img id="date-badge">
          <img id="python-badge">
          <img id="pyi-badge">

          <h2>Build Information</h2>
          <div id="build-info"></div>

          <h2>Artifacts</h2>
          <div id="artifact-table"></div>

          <script src="dashboard.js"></script>

          </body>
          </html>
          EOF

      - name: Generate metadata.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          DATESTAMP="${{ steps.meta.outputs.datestamp }}"
          GIT_HASH="${{ steps.meta.outputs.hash }}"
          RUN_ID="${{ github.run_id }}"

          cat > gh-pages/nightly/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
              "commit": "${GIT_HASH}",
              "branch": "nightly",
              "workflow_run_id": "${RUN_ID}"
            },
            "toolchain": {
              "python": "$(python3 --version | awk '{print $2}')",
              "pyinstaller": "$(pyinstaller --version)"
            },
            "artifacts": [
          EOF

          FIRST=1
          for f in artifacts/*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            CRC=$(crc32 "$f" || echo "00000000")
            TYPE=$(echo "$NAME" | sed -E 's/.*\.(tgz|zip|deb|rpm)$/\1/')
            OS="linux"
            ARCH="x86_64"

            if [ $FIRST -eq 0 ]; then echo "," >> gh-pages/nightly/metadata.json; fi
            FIRST=0

            cat >> gh-pages/nightly/metadata.json <<EOF
              {
                "name": "${NAME}",
                "size": ${SIZE},
                "sha256": "${SHA}",
                "crc32": "${CRC}",
                "type": "${TYPE}",
                "os": "${OS}",
                "arch": "${ARCH}"
              }
          EOF
          done

          echo "    ]" >> gh-pages/nightly/metadata.json
          echo "}" >> gh-pages/nightly/metadata.json

      # Copy dashboard.js from MAIN
      - name: Copy dashboard.js
        run: cp main/packaging/dashboard/dashboard.js gh-pages/nightly/

      # Upload gh-pages folder for deployment
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      # -----------------------------
      # ⭐ Publish to gh-pages
      # -----------------------------
      - name: Publish dashboard to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p nightly
          cp -r dashboard/* nightly/

          git add .
          git commit -m "Update nightly dashboard" || echo "No changes"
          git push origin gh-pages
