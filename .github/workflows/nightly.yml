name: Nightly Build

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:

  nightly-build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.capture.outputs.version }}
      commit: ${{ steps.capture.outputs.commit }}
      build_date: ${{ steps.capture.outputs.build_date }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean workspace
        run: git clean -xfd

      - name: Skip build if no relevant changes
        run: |
          # Compare this commit with the previous one
          if git diff --quiet HEAD^ HEAD -- packaging src scripts requirements.txt; then
            echo "No relevant changes detected — skipping nightly build."
            exit 0
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc rpm dpkg-dev libarchive-zip-perl
          sudo apt-get install -y libsnmp-dev snmp-mibs-downloader

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller jsonschema
          python3 -m pip install git+https://github.com/linktech-engineering-llc/PythonTools.git

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh
          chmod +x packaging/*.sh

      - name: Run full packaging pipeline
        run: |
          packaging/build_all.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packaging/output/*.tgz artifacts/ || true
          cp packaging/output/*.zip artifacts/ || true
          cp packaging/output/*.deb artifacts/ || true
          cp packaging/output/*.rpm artifacts/ || true

      - name: Capture version + commit + date
        id: capture
        run: |
          DEB_FILE=$(ls -t packaging/output/nms-tools_* | head -n 1)
          BASENAME=$(basename "$DEB_FILE")
          VERSION=$(echo "$BASENAME" | sed -E 's/nms-tools[-_]?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Generate metadata.json
        run: |
          mkdir -p artifacts

          VERSION="${{ steps.capture.outputs.version }}"
          COMMIT="${{ steps.capture.outputs.commit }}"
          BUILD_DATE="${{ steps.capture.outputs.build_date }}"

          PYTHON_VERSION=$(python3 --version | awk '{print $2}')
          PYINSTALLER_VERSION=$(pyinstaller --version 2>/dev/null || echo "unknown")
          BUILDER_OS="ubuntu-latest"

          cat > artifacts/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "$BUILD_DATE",
              "commit": "$COMMIT",
              "version": "$VERSION",
              "branch": "nightly",
              "workflow_run_id": $GITHUB_RUN_ID
          },
            "toolchain": {
              "python": "$PYTHON_VERSION",
              "pyinstaller": "$PYINSTALLER_VERSION",
              "builder_os": "$BUILDER_OS"
          },
            "binary_license": {
              "name": "NMS_Tools Binary License",
              "file": "LICENSE_BINARY.txt",
              "url": "https://github.com/linktech-engineering-llc/NMS_Tools/blob/nightly/LICENSE_BINARY.txt"
          },
            "artifacts": [
          EOF

          FIRST=1
          for f in artifacts/nms-tools_*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            CRC=$(crc32 "$f")

            case "$NAME" in
              *.deb)
                TYPE="deb"
                OS="linux"
                ARCH="amd64"
                ;;
              *.rpm)
                TYPE="rpm"
                OS="linux"
                ARCH="x86_64"
                ;;
              *.zip)
                TYPE="zip"
                OS="windows"
                ARCH="x86_64"
                ;;
              *.tgz|*.tar.gz)
                TYPE="tgz"
                OS="linux"
                ARCH="amd64"
                ;;
              *)
                TYPE="unknown"
                OS="unknown"
                ARCH="unknown"
                ;;
            esac

            if [ $FIRST -eq 0 ]; then
              echo "," >> artifacts/metadata.json
            fi
            FIRST=0

            cat >> artifacts/metadata.json <<EOF
              {
                "name": "$NAME",
                "type": "$TYPE",
                "os": "$OS",
                "arch": "$ARCH",
                "size": $SIZE,
                "sha256": "$SHA",
                "crc32": "$CRC"
              }
          EOF

          done

          cat >> artifacts/metadata.json <<EOF
            ]
          }
          EOF

      - name: Validate metadata.json
        run: |
          python3 packaging/metadata/validate.py artifacts/metadata.json

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      - name: Remove existing nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view nightly --json assets --jq '.assets[].name')
          for asset in $ASSETS; do
            if [[ "$asset" == nms* ]]; then
              gh release delete-asset nightly "$asset" --yes
            fi
          done

      - name: Upload artifacts to nightly release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          files: packaging/output/*

      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

  publish-dashboard:
    runs-on: ubuntu-latest
    needs: nightly-build

    steps:
      # 1. Create repo workspace (MUST be first)
      - name: Base checkout (create repo workspace)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 2. Ensure gh-pages exists
      - name: Ensure gh-pages exists
        run: |
          if ! git ls-remote --exit-code origin gh-pages; then
            echo "gh-pages does not exist. Initializing..."
            git checkout --orphan gh-pages
            git commit --allow-empty -m "Initialize gh-pages"
            git push origin gh-pages
          fi

      # 3. Checkout gh-pages
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      # 4. Wipe gh-pages clean
      - name: Wipe gh-pages (preserve .git)
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

      # 5. Prepare dashboard folder
      - name: Create dashboard folder
        run: mkdir -p dashboard

      # 6. Download nightly artifacts
      - name: Download nightly artifacts
        uses: actions/download-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      - name: Copy metadata.json
        run: cp artifacts/metadata.json dashboard/metadata.json

      # 7. Sparse checkout main (dashboard only)
      - name: Sparse checkout main (dashboard only)
        run: |
          git fetch origin main
          git sparse-checkout init --cone
          git sparse-checkout set packaging/dashboard
          git checkout main

      # 8. Copy dashboard assets
      - name: Copy dashboard assets
        run: |
          cp packaging/dashboard/index.html dashboard/index.html
          cp packaging/dashboard/styles.css dashboard/styles.css
          cp packaging/dashboard/dashboard.js dashboard/dashboard.js

      # 9. Publish dashboard using a throwaway repo
      - name: Publish dashboard via throwaway repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish
          cd publish

          # Initialize clean repo
          git init

          # Configure identity INSIDE the throwaway repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add remote (mirror or GitHub)
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/linktech-engineering-llc/NMS_Tools.git

          # Fetch gh-pages if it exists
          git fetch origin gh-pages || true

          # Checkout or create gh-pages
          git checkout gh-pages || git checkout --orphan gh-pages

          # Wipe everything except .git
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          # Copy dashboard files from main workspace
          cp -r ../dashboard ./dashboard

          # Commit
          git add .
          git commit -m "Update nightly dashboard"

          # Push (force ensures clean overwrite)
          git push origin gh-pages --force
