name: Nightly Build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:

  nightly-build:
    runs-on: ubuntu-latest

    env:
      NIGHTLY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            rpm \
            dpkg-dev

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build tools
        run: ./scripts/build_all.sh

      - name: Build DEB and RPM via Makefile
        run: make packages

      - name: Debug DEB output
        run: |
          echo "Searching for DEB files..."
          find packaging -type f -name "*.deb" -print

      - name: Collect DEB artifact
        if: always()
        run: |
          mkdir -p artifacts
          cp packaging/nms-tools_*.deb artifacts/ || true

      - name: Collect RPM artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find "$HOME/rpmbuild/RPMS" -type f -name "*.rpm" -exec cp {} artifacts/ \; || true

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly
  publish-dashboard:
    runs-on: ubuntu-latest
    needs: nightly-build

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download nightly artifacts
        uses: actions/download-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      - name: Extract version metadata
        id: meta
        run: |
          DEB_FILE=$(ls -t artifacts/*.deb | head -n 1)
          RPM_FILE=$(ls -t artifacts/*.rpm | head -n 1)

          BASENAME=$(basename "$DEB_FILE")
          VERSION=$(echo "$BASENAME" | sed -n 's/nms-tools_\(.*\)\.deb/\1/p')

          DATESTAMP=$(echo "$VERSION" | grep -o '+[0-9]\{8\}' | tr -d '+')
          GIT_HASH=$(echo "$VERSION" | sed -n 's/.*git\([0-9a-f]\+\).*/\1/p')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "datestamp=$DATESTAMP" >> $GITHUB_OUTPUT
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT

      - name: Create ZIP (DEB + RPM)
        run: |
          mkdir -p zipbuild
          cp artifacts/*.deb zipbuild/
          cp artifacts/*.rpm zipbuild/
          cd zipbuild
          zip ../nms-tools.zip *
          cd ..

      - name: Upload assets to nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: "Automated nightly build of NMS_Tools."
          draft: false
          prerelease: false
          make_latest: false
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            nms-tools.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean working directory (remove all binaries)
        run: |
          rm -rf artifacts
          rm -rf zipbuild
          rm -f nms-tools.zip
          rm -f *.deb
          rm -f *.rpm
          rm -f *.zip

      - name: Generate dashboard HTML
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          DATESTAMP="${{ steps.meta.outputs.datestamp }}"
          GIT_HASH="${{ steps.meta.outputs.hash }}"

          RELEASE_URL="https://github.com/Linktech-Engineering-LLC/NMS_Tools/releases/download/nightly"

          mkdir -p dashboard
          rm -f dashboard/*

          curl -s -o dashboard/qr.png \
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://linktech-engineering-llc.github.io/"

          cat > dashboard/index.html <<EOF
          <html>
          <head>
            <title>NMS_Tools Nightly Dashboard</title>
            <style>
              body { font-family: Arial; margin: 20px; }
              table { border-collapse: collapse; margin-top: 10px; }
              th, td { padding: 8px 12px; border: 1px solid #ccc; }
              th { background: #f0f0f0; }
            </style>
          </head>
          <body>

          <h1>NMS_Tools Nightly Dashboard</h1>

          <h2>Build Metadata</h2>
          <table>
            <tr><th>Field</th><th>Value</th></tr>
            <tr><td>Version</td><td>${VERSION}</td></tr>
            <tr><td>Date</td><td>${DATESTAMP}</td></tr>
            <tr><td>Commit</td><td>${GIT_HASH}</td></tr>
          </table>

          <h2>Downloads</h2>
          <table>
            <tr><th>Artifact</th><th>Download</th></tr>
            <tr>
              <td>DEB Package</td>
              <td><a href="${RELEASE_URL}/nms-tools.deb">nms-tools.deb</a></td>
            </tr>
            <tr>
              <td>RPM Package</td>
              <td><a href="${RELEASE_URL}/nms-tools.rpm">nms-tools.rpm</a></td>
            </tr>
            <tr>
              <td>All Artifacts (ZIP)</td>
              <td><a href="${RELEASE_URL}/nms-tools.zip">nms-tools.zip</a></td>
            </tr>
          </table>

          <h2>QR Code</h2>
          <img src="qr.png" width="200" height="200">

          </body>
          </html>
          EOF

      - name: Publish dashboard to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp -r dashboard/* .

          git add .
          git commit -m "Update nightly dashboard" || echo "No changes"
          git push origin gh-pages
