name: Nightly Build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:

  nightly-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            rpm \
            dpkg-dev \
            zip

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Make scripts executable
        run: chmod +x scripts/*.sh packaging/*.sh

      - name: Run full packaging pipeline
        run: packaging/build_all.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packaging/output/*.tgz artifacts/ || true
          cp packaging/output/*.zip artifacts/ || true
          cp packaging/output/*.deb artifacts/ || true
          cp packaging/output/*.rpm artifacts/ || true

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

  publish-dashboard:
    runs-on: ubuntu-latest
    needs: nightly-build

    steps:
      # Checkout GH-PAGES branch (dashboard.js already lives here)
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # Preserve existing dashboard.js
      - name: Preserve existing dashboard.js
        run: |
          if [ -f dashboard.js ]; then
            cp dashboard.js dashboard.js.bak
          fi

      # Download nightly artifacts
      - name: Download nightly artifacts
        uses: actions/download-artifact@v4
        with:
          name: nightly-nms-tools
          path: artifacts

      # Extract version metadata
      - name: Extract version metadata
        id: meta
        run: |
          DEB_FILE=$(ls -t artifacts/*.deb | head -n 1)
          BASENAME=$(basename "$DEB_FILE")
          VERSION=$(echo "$BASENAME" | sed -n 's/nms-tools_\(.*\)\.deb/\1/p')
          DATESTAMP=$(echo "$VERSION" | grep -o '+[0-9]\{8\}' | tr -d '+')
          GIT_HASH=$(echo "$VERSION" | sed -n 's/.*git\([0-9a-f]\+\).*/\1/p')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "datestamp=$DATESTAMP" >> $GITHUB_OUTPUT
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT

      # Compute checksums and sizes
      - name: Compute checksums and sizes
        id: sums
        run: |
          for f in artifacts/*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            echo "${NAME}_size=$SIZE" >> $GITHUB_OUTPUT
            echo "${NAME}_sha256=$SHA" >> $GITHUB_OUTPUT
          done

      # Generate dashboard HTML
      - name: Generate dashboard HTML
        run: |
          mkdir -p dashboard
          rm -f dashboard/*

          cat > dashboard/index.html <<EOF
          <html>
          <head>
            <title>NMS_Tools Nightly Dashboard</title>
            <style>
              body { font-family: Arial; margin: 20px; }
              table { border-collapse: collapse; margin-top: 10px; width: 100%; }
              th, td { padding: 8px 12px; border: 1px solid #ccc; }
              th { background: #f0f0f0; }
              .badge-row img { margin-right: 8px; }
            </style>
          </head>
          <body>

          <h1>NMS_Tools Nightly Dashboard</h1>

          <div class="badge-row">
            <img src="https://img.shields.io/badge/version-loading-blue" id="version-badge">
            <img src="https://img.shields.io/badge/date-loading-lightgrey" id="date-badge">
            <img src="https://img.shields.io/badge/python-loading-yellow" id="python-badge">
            <img src="https://img.shields.io/badge/pyinstaller-loading-orange" id="pyi-badge">
          </div>

          <h2>Build Metadata</h2>
          <div id="build-info"></div>

          <h2>Artifacts</h2>
          <div id="artifact-table"></div>

          <script src="dashboard.js"></script>
          </body>
          </html>
          EOF

      # Generate metadata.json
      - name: Generate metadata.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          DATESTAMP="${{ steps.meta.outputs.datestamp }}"
          GIT_HASH="${{ steps.meta.outputs.hash }}"
          RUN_ID="${{ github.run_id }}"

          cat > dashboard/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
              "commit": "${GIT_HASH}",
              "branch": "nightly",
              "workflow_run_id": "${RUN_ID}"
            },
            "toolchain": {
              "python": "$(python3 --version | awk '{print $2}')",
              "pyinstaller": "$(pyinstaller --version)"
            },
            "artifacts": [
          EOF

          FIRST=1
          for f in artifacts/*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            CRC=$(crc32 "$f" || echo "00000000")
            TYPE=$(echo "$NAME" | sed -E 's/.*\.(tgz|zip|deb|rpm)$/\1/')
            OS="linux"
            ARCH="x86_64"

            if [ $FIRST -eq 0 ]; then echo "," >> dashboard/metadata.json; fi
            FIRST=0

            cat >> dashboard/metadata.json <<EOF
              {
                "name": "${NAME}",
                "size": ${SIZE},
                "sha256": "${SHA}",
                "crc32": "${CRC}",
                "type": "${TYPE}",
                "os": "${OS}",
                "arch": "${ARCH}"
              }
          EOF
          done

          echo "    ]" >> dashboard/metadata.json
          echo "}" >> dashboard/metadata.json

      # Restore dashboard.js
      - name: Restore dashboard.js
        run: |
          if [ -f dashboard.js.bak ]; then
            mv dashboard.js.bak dashboard.js
          fi

      # Publish dashboard to gh-pages
      - name: Publish dashboard to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp -r dashboard/* .

          git add .
          git commit -m "Update nightly dashboard" || echo "No changes"
          git push origin gh-pages
