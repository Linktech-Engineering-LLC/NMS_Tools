<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="author"
        content="Leon McClatchey">

  <meta name="description"
        content="NMS_Tools nightly builds, package downloads, checksums, release metadata, and build information from Linktech Engineering LLC.">

  <meta name="keywords"
        content="NMS_Tools,Nagios,monitoring,network management,Python,Linktech Engineering,Linux,automation">

  <meta name="robots"
        content="index,follow">

  <title>NMS_Tools Nightly Dashboard</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>NMS_Tools Nightly Dashboard</h1>

  <div class="badge-row">
    <img id="version-badge">
    <img id="date-badge">
    <img id="python-badge">
    <img id="pyi-badge">
  </div>

  <h2>Build Metadata</h2>
  <div id="build-info"></div>

  <h2>Artifacts</h2>
  <div id="artifact-table"></div>

  <div class="qr">
    <h2>QR Code</h2>
    <img id="qr-code" src="qr.png" alt="QR Code">
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
